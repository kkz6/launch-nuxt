name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fired by the docs repo (NUXT_CONTENT_DOCS_REPO) on push, so a docs
  # change rebuilds the image with the fresh markdown and redeploys.
  repository_dispatch:
    types: [docs-updated]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Docs content source (optional). Repo URL is a non-secret repo
          # Variable; the token (private repos only) is a BuildKit secret.
          build-args: |
            NUXT_CONTENT_DOCS_REPO=${{ vars.NUXT_CONTENT_DOCS_REPO }}
          secrets: |
            nuxt_content_token=${{ secrets.NUXT_CONTENT_GITHUB_TOKEN }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            service=launch-nuxt
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Dispatch deploy to launch-deploy
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'repository_dispatch'
        uses: peter-evans/repository-dispatch@v3
        with:
          # Fine-grained PAT with `Actions: Read & write` on kkz6/launch-deploy.
          # Stored as a secret in this repo. No code access.
          token: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          repository: kkz6/launch-deploy
          event-type: deploy-nuxt
          client-payload: |
            {
              "image_tag": "${{ github.sha }}",
              "source_repo": "${{ github.repository }}",
              "source_sha": "${{ github.sha }}"
            }
