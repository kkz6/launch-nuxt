name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            service=launch-nuxt
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy:
    name: Dispatch frontend deploy
    needs: build-and-push
    # Pause dispatch for coordinated API/frontend releases without blocking
    # image builds. Resume only after the compatible API has been deployed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FRONTEND_DEPLOY_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: frontend-production
    permissions:
      actions: read

    steps:
      - name: Require successful CI and security checks for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in ci.yml central-security.yml; do
            passed=false
            for attempt in $(seq 1 90); do
              run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" --jq '.workflow_runs[0]')
              if [ "$(jq -r '.status // "pending"' <<< "$run")" = completed ]; then
                conclusion=$(jq -r '.conclusion' <<< "$run")
                if [ "$conclusion" != success ]; then
                  echo "::error::$workflow concluded $conclusion for $GITHUB_SHA; deployment blocked."
                  exit 1
                fi
                passed=true
                break
              fi
              sleep 10
            done
            if [ "$passed" != true ]; then
              echo "::error::Timed out waiting for $workflow on $GITHUB_SHA; deployment blocked."
              exit 1
            fi
          done

      - name: Create a short-lived deployment token
        id: deploy-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FRONTEND_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FRONTEND_DEPLOY_APP_PRIVATE_KEY }}
          owner: kkz6
          repositories: launch-deploy
          permission-actions: write

      - name: Dispatch deploy to launch-deploy
        env:
          GH_TOKEN: ${{ steps.deploy-token.outputs.token }}
        run: |
          deploy_url=$(gh api --method POST repos/kkz6/launch-deploy/actions/workflows/deploy.yml/dispatches \
            -f ref=main -f 'inputs[destination]=nuxt' -f "inputs[image_tag]=$GITHUB_SHA" \
            -F return_run_details=true --jq .html_url)
          echo "[Production deploy]($deploy_url)" >> "$GITHUB_STEP_SUMMARY"
